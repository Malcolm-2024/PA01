<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PA01 Part 2 - Forms and Tables</title>
</head>
<body>

  <h1>PA01 Part 2: HTML Forms and Tables</h1>
  <p>This page demonstrates an HTML form and a structured table.</p>

  <h2>Student Information Form</h2>

  <form>
    <label for="firstName">First Name:</label>
    <input type="text" id="firstName" name="firstName" required><br><br>

    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName" name="lastName" required><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required><br><br>

    <p>Do you like this site?</p>
    <input type="radio" id="yes" name="likeSite" value="yes">
    <label for="yes">Yes</label>

    <input type="radio" id="no" name="likeSite" value="no">
    <label for="no">No</label><br><br>

    <input type="checkbox" id="subscribe" name="subscribe">
    <label for="subscribe">Subscribe to newsletter</label><br><br>

    <label for="browser">Which browser do you use?</label>
    <select id="browser" name="browser">
      <option value="chrome">Chrome</option>
      <option value="firefox">Firefox</option>
      <option value="edge">Microsoft Edge</option>
      <option value="safari">Safari</option>
    </select><br><br>

    <input type="submit" value="Submit">
  </form>

  <h2>Weekly Class Schedule</h2>

  <table border="1">
    <tr>
      <th>Day</th>
      <th>Course</th>
      <th>Time</th>
    </tr>
    <tr>
      <td>Monday</td>
      <td>Computer Science</td>
      <td>10:00 AM</td>
    </tr>
    <tr>
      <td>Wednesday</td>
      <td>Web Development</td>
      <td>12:30 PM</td>
    </tr>
    <tr>
      <td>Friday</td>
      <td>Database Systems</td>
      <td>2:00 PM</td>
    </tr>
  </table>

</body>
</html>
